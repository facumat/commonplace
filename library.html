<!DOCTYPE html>
<html>
<head>
    <title>My Commonplace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon-commonplace.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --main-color: #2E5FFF;
            --main-muted: #2E5FFF15;
            --main-secondary: #2E5FFF50;
        }

    </style>
</head>
<body>
    <section class="two-columns">
        <div class="left-panel container">
            <button class="button outline" onclick="history.back()">← Go Back</button>
            <h1>My Commonplace</h1>
            <p>Pleasant is the glint of the sun today upon these margins, because it flickers so.</p>
            <p><em><b>Planted:</b> Nov 24, 2025. <b>Last tended:</b> <span id="last-modified-date"></span></em></p>
            <hr>
            <div class="filters">
                <div class="filter-section">
                    <p>Search:</p>
                    <input type="text" id="search-input" placeholder="Search items..." />
                </div>
                <div class="filter-section">
                    <p>Filter by Month:</p>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <select id="month-select" class="month-year-select" onchange="filterByMonth()">
                            <option value="">Month</option>
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                        <select id="year-select" class="month-year-select" onchange="filterByMonth()">
                            <option value="">Year</option>
                        </select>
                        <button class="button outline" onclick="clearMonthFilter()">Clear</button>
                    </div>
                </div>
                <div class="filter-section">
                    <p>Filter by Type:</p>
                    <div class="filters-group" id="type-filters"></div>
                </div>
                <div class="filter-section">
                    <p>Filter by Genre:</p>
                    <div class="filters-group" id="genre-filters"></div>
                </div>
                <div class="filter-section">
                    <p>Filter by Tags:</p>
                    <div class="filters-group" id="tag-filters"></div>
                </div>
                <button class="button outline" onclick="clearAllFilters()">Clear All Filters</button>
            </div>
        </div>
        <div class="right-panel container">
            <div id="movies" class="collection">
            </div>
        </div>
    </section>
    
</body>
</html>
