<!DOCTYPE html>
<html>
<head>
    <title>Facu's digital commonplace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon-commonplace.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --main-color: #2E5FFF;
            --main-muted: #2E5FFF15;
            --main-secondary: #2E5FFF50;

        }

        .entry  {
            padding: 16px;
            border: solid;
            border-width: 0.5px;
            border-style: dashed;
        }

        .entry img {
            width: 150px; 
            height: auto;
            margin-top: 8px;
        }

        .type-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 99px;
            background-color: #2E5FFF15;
        }
        
        .filter-section {
            margin-bottom: 24px;
        }

        .filter-section p {
            margin-bottom: 8px;
        }

        .filters-group {
            display: flex;            
            gap: 4px;
            row-gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .tag-filter-btn, .type-filter-btn, .genre-filter-btn {
            font-family: "Times", serif;
            font-size: 16px;
            letter-spacing: -0.6%;
            color: var(--main-color);
            border-radius: 99px;
            padding: 4px 8px;
            background-color: var(--main-muted);
            border: 0.25px dashed ;
            border-color: #ffffff00;        }

        .tag-filter-btn:hover, .type-filter-btn:hover, .genre-filter-btn:hover  {
            border: 0.25px solid ;
            border-color: var(--main-color);
        }

        .tag-filter-btn.active, .type-filter-btn.active, .genre-filter-btn.active {
            background-color: #2E5FFF35;
            border: 0.25px dashed ;
            border-color: var(--main-color);
        }

        input {
            width: 100%;
            background-color: transparent;
            padding: 8px;
            font-family: "Times", serif;
            font-size: 16px;
            border: 0.25px solid var(--main-color);
            border-radius: 4px;
            color: var(--main-color);
            box-sizing: border-box;
        }

        input::placeholder {
            color: var(--main-secondary);
        }

    </style>
</head>
<body>
    <section class="two-columns">
        <div class="left-panel container">
            <button class="button" onclick="history.back()">← Go Back</button>
            <h1>My Commonplace</h1>
            <p>Pleasant is the glint of the sun today upon these margins, because it flickers so.</p>
            <p><em><b>Planted:</b> Nov 24, 2025. <b>Last tended:</b> <span id="last-modified-date"></span></em></p>
            <hr>
            <div class="filters">
                <div class="filter-section">
                    <p>Search:</p>
                    <input type="text" id="search-input" placeholder="Search items..."/>
                </div>
                <div class="filter-section">
                    <p>Filter by Type:</p>
                    <div class="filters-group" id="type-filters"></div>
                </div>
                <div class="filter-section">
                    <p>Filter by Genre:</p>
                    <div class="filters-group" id="genre-filters"></div>
                </div>
                <div class="filter-section">
                    <p>Filter by Tags:</p>
                    <div class="filters-group" id="tag-filters"></div>
                </div>
                <button class="button outline" onclick="clearAllFilters()">Clear All Filters</button>
            </div>
        </div>
        <div class="right-panel container">
            <div id="movies" class="collection">
            </div>
        </div>
    </section>
    
    <script>
        // variables for filtering
        let allItems = [];
        let selectedTypes = new Set();
        let selectedGenres = new Set();
        let selectedTags = new Set();
        let searchText = '';
        function showLastModified() {
            var lastModifiedDate = new Date(document.lastModified);
            var options = { month: 'short', day: 'numeric', year: 'numeric' };
            var formattedDate = lastModifiedDate.toLocaleDateString('en-US', options);
            document.getElementById("last-modified-date").innerHTML = formattedDate;
        }

        window.onload = showLastModified;
        
        // format date
        function formatDate(dateString) {
            if (!dateString || dateString === 'YYYY-MM-DD') return '';
            
            const date = new Date(dateString);
            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        // toggle type filter
        function toggleTypeFilter(type) {
            if (selectedTypes.has(type)) {
                selectedTypes.delete(type);
            } else {
                selectedTypes.add(type);
            }
            updateFilterButtons();
            displayFilteredItems();
        }

        // Toggle tag filter
        function toggleTagFilter(tag) {
            if (selectedTags.has(tag)) {
                selectedTags.delete(tag);
            } else {
                selectedTags.add(tag);
            }
            updateFilterButtons();
            displayFilteredItems();
        }

        // Toggle genre filter
        function toggleGenreFilter(genre) {
            if (selectedGenres.has(genre)) {
                selectedGenres.delete(genre);
            } else {
                selectedGenres.add(genre);
            }
            updateFilterButtons();
            displayFilteredItems();
        }

        // Handle search input
        function handleSearch(event) {
            searchText = event.target.value.toLowerCase();
            displayFilteredItems();
        }

        // Update button active states
        function updateFilterButtons() {
            document.querySelectorAll('.type-filter-btn').forEach(btn => {
                const type = btn.dataset.type;
                if (selectedTypes.has(type)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.querySelectorAll('.tag-filter-btn').forEach(btn => {
                const tag = btn.dataset.tag;
                if (selectedTags.has(tag)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.querySelectorAll('.genre-filter-btn').forEach(btn => {
                const genre = btn.dataset.genre;
                if (selectedGenres.has(genre)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Clear filters
        function clearAllFilters() {
            selectedTypes.clear();
            selectedTags.clear();
            selectedGenres.clear();
            searchText = '';
            document.getElementById('search-input').value = '';
            updateFilterButtons();
            displayFilteredItems();
        }

        // Display filtered 
        function displayFilteredItems() {
            let filteredItems = allItems;

            // Filter by type if any types selected
            if (selectedTypes.size > 0) {
                filteredItems = filteredItems.filter(item => 
                    selectedTypes.has(item.type)
                );
            }

            // Filter by genre if any genres selected
            if (selectedGenres.size > 0) {
                filteredItems = filteredItems.filter(item => 
                    selectedGenres.has(item.genre)
                );
            }

            // Filter by tags if any tags selected
            if (selectedTags.size > 0) {
                filteredItems = filteredItems.filter(item => {
                    const itemTags = item.tags || [];
                    return itemTags.some(tag => selectedTags.has(tag));
                });
            }

            // Filter by search text
            if (searchText) {
                filteredItems = filteredItems.filter(item => {
                    const title = (item.thing || '').toLowerCase();
                    const from = (item.from || '').toLowerCase();
                    const genre = (item.genre || '').toLowerCase();
                    const thoughts = (item.thoughts || '').toLowerCase();
                    const tags = (item.tags || []).join(' ').toLowerCase();
                    
                    return title.includes(searchText) || 
                           from.includes(searchText) || 
                           thoughts.includes(searchText) ||
                           tags.includes(searchText) ||
                           genre.includes(searchText);
                });
            }

            displayItems(filteredItems);
        }

        // Display items function
        function displayItems(items) {
            const container = document.getElementById('movies');
            container.innerHTML = '';
            
            let lastDate = null;

            items.forEach(item => {
                const title = item.thing;
                const genre = item.genre;
                const date = item.consumed;
                const tags = item.tags || [];
                const thoughts = item.thoughts || '';
                const from = item.from || '';
                const yearDisplay = (item.year && item.year !== 'YYYY' && item.year !== 'null') 
                    ? `(${item.year})` 
                    : '';
                
                const formattedDate = formatDate(date);
                
                // Check if date has changed and add divider
                if (date && date !== lastDate) {
                    const dividerHTML = `
                        <div style="margin: 32px 0 16px 0; padding: 8px 0; border-bottom: 1px solid var(--main-color);">
                            <p style="margin: 0; color: var(--main-color);"><strong>${formattedDate}</strong></p>
                        </div>
                    `;
                    container.innerHTML += dividerHTML;
                    lastDate = date;
                }

                // Different HTML based on type
                let entryHTML = '';
                
                if (item.type === 'movie') {
                    entryHTML = `
                        <div class="entry entry-movie">
                            <div class="type-tag">${item.type}</div>
                            <div class="content">
                                <h3>${title}</h3>
                                <p>${from} ${yearDisplay}</p>
                                <p>${genre}${thoughts ? `. On <em>${tags.join(', ')}</em>` : ''}</p>
                                ${thoughts ? `<p>${thoughts}</p>` : ''}
                            </div>
                        </div>
                    `;
                } else if (item.type === 'glossary') {
                    entryHTML = `
                        <div class="entry entry-glossary">
                            <div class="type-tag">${item.type}</div>
                            <h3>${from}</h3>
                            <p class="definition">${title}</p>
                            <p>On <em>${tags.join(', ')}</em></p>
                            ${thoughts ? `<p class="notes">${thoughts}</p>` : ''}
                        </div>
                    `;
                } else if (item.type === 'videoclip') {
                    entryHTML = `
                        <div class="entry entry-videoclip">
                            <div class="type-tag">${item.type}</div>
                            <div class="content">
                                <h3>${title}</h3>
                                <p>${from} ${yearDisplay}</p>
                                ${item.url && item.url !== 'null' ? `<a href="${item.url}" target="_blank">Link</a>` : ''}
                                <p>${genre}${thoughts ? `. On <em>${tags.join(', ')}</em>` : ''}</p>
                                ${thoughts ? `<p>${thoughts}</p>` : ''}
                            </div>
                        </div>
                    `;
                } else if (item.type === 'music') {
                    entryHTML = `
                        <div class="entry entry-music">
                            <div class="type-tag">${item.type}</div>
                            <div class="content">
                                <h3>${title}</h3>
                                <p>${from} ${yearDisplay}</p>
                                <p>${genre}${thoughts ? `. On <em>${tags.join(', ')}</em>` : ''}</p>
                                ${thoughts ? `<p>${thoughts}</p>` : ''}
                            </div>
                        </div>
                    `;
                } else if (item.type === 'image') {
                    entryHTML = `
                        <div class="entry entry-image">
                            <div class="type-tag">${item.type}</div>
                            <div>${item.image ? `<img src="${item.image}" alt="${title}" loading="lazy">` : ''}</div>
                            <p class="caption">${title}</p>
                            <p>${from} ${yearDisplay}</p>
                            ${thoughts ? `<p>${thoughts}</p>` : ''}
                        </div>
                    `;
                } else if (item.type === 'article') {
                    entryHTML = `
                        <div class="entry entry-article">
                            <div class="type-tag">${item.type}</div>
                            <h3>${title}</h3>
                            <p>${from} ${yearDisplay}</p>
                            ${item.url && item.url !== 'null' ? `<a href="${item.url}" target="_blank">Link</a>` : ''}
                            <p>On <em>${tags.join(', ')}</em></p>
                            ${thoughts ? `<p>${thoughts}</p>` : ''}
                        </div>
                    `;
                } else if (item.type === 'quote') {
                    entryHTML = `
                        <div class="entry entry-quote">
                            <div class="type-tag">${item.type}</div>
                            <h3>"${title}"</h3>
                            <p>${from} ${yearDisplay}</p>
                            ${item.url && item.url !== 'null' ? `<a href="${item.url}" target="_blank">Link</a>` : ''}
                            <p>On <em>${tags.join(', ')}</em></p>
                            ${thoughts ? `<p>${thoughts}</p>` : ''}
                        </div>
                    `;
                } else {
                    // Default format for other types
                    entryHTML = `
                        <div class="entry entry-${item.type || 'default'}">
                            <div class="type-tag">${item.type}</div>
                            <div>${item.image ? `<img src="${item.image}" alt="${title}" loading="lazy">` : ''}</div>
                            <h3>${title}</h3>
                            <p>${from} ${yearDisplay}</p>
                            ${item.url && item.url !== 'null' ? `<a href="${item.url}" target="_blank">Link</a>` : ''}
                            <p>On <em>${tags.join(', ')}</em></p>
                            ${thoughts ? `<p>${thoughts}</p>` : ''}
                        </div>
                    `;
                }
                
                container.innerHTML += entryHTML;
            });
        }

        // Fetch and display collected items
        Promise.all([
            fetch('json/watched.json').then(response => response.json()),
            fetch('json/collected.json').then(response => response.json()).catch(() => []),
            fetch('json/read.json').then(response => response.json()).catch(() => []),
            fetch('json/listened.json').then(response => response.json()).catch(() => [])
        ])
        .then(([watched, collected, read, listened]) => {
            // Combine all arrays
            allItems = [...watched, ...collected, ...read, ...listened];
            
            // Sort by date, newest first
            allItems.sort((a, b) => {
                const dateA = a.consumed || a.collected || '';
                const dateB = b.consumed || b.collected || '';
                
                // Convert to actual Date objects for proper comparison
                if (!dateA && !dateB) return 0;
                if (!dateA) return 1;  // Items without dates go to end
                if (!dateB) return -1;
                
                const timeA = new Date(dateA).getTime();
                const timeB = new Date(dateB).getTime();
                
                return timeB - timeA;  // Newest first
            });

            // Filter out null items
            allItems = allItems.filter(item => (item.thing !== null));

            // Extract unique types
            const types = new Set();
            allItems.forEach(item => {
                if (item.type) types.add(item.type);
            });

            // Extract unique genres
            const genres = new Set();
            allItems.forEach(item => {
                if (item.genre) genres.add(item.genre);
            });

            // Extract unique tags
            const tags = new Set();
            allItems.forEach(item => {
                if (item.tags) {
                    item.tags.forEach(tag => tags.add(tag));
                }
            });

            // Create type filter buttons
            const typeFiltersContainer = document.getElementById('type-filters');
            Array.from(types).sort().forEach(type => {
                const btn = document.createElement('button');
                btn.className = 'type-filter-btn';
                btn.dataset.type = type;
                btn.textContent = type;
                btn.onclick = () => toggleTypeFilter(type);
                typeFiltersContainer.appendChild(btn);
            });

            // Create tag filter buttons
            const tagFiltersContainer = document.getElementById('tag-filters');
            Array.from(tags).sort().forEach(tag => {
                const btn = document.createElement('button');
                btn.className = 'tag-filter-btn';
                btn.dataset.tag = tag;
                btn.textContent = tag;
                btn.onclick = () => toggleTagFilter(tag);
                tagFiltersContainer.appendChild(btn);
            });

            // Create genre filter buttons
            const genreFiltersContainer = document.getElementById('genre-filters');
            Array.from(genres).sort().forEach(genre => {
                const btn = document.createElement('button');
                btn.className = 'genre-filter-btn';
                btn.dataset.genre = genre;
                btn.textContent = genre;
                btn.onclick = () => toggleGenreFilter(genre);
                genreFiltersContainer.appendChild(btn);
            });

            // Connect search input
            document.getElementById('search-input').addEventListener('input', handleSearch);

            // Display all items initially
            displayItems(allItems);
        })
        .catch(error => {
            console.error('Error loading data:', error);
            document.getElementById('movies').innerHTML = '<p>Error loading content</p>';
        });
    </script>
</body>
</html>
